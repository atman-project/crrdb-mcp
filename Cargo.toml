[package]
name    = "rust-template"
version = "0.0.1"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
rmcp = { version = "3", features = ["macros", "server", "transport-io"] }
rusqlite = "0.40.2"
schemars = "1.2.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tracing = "0.1"
tracing-subscriber = "0.3"
